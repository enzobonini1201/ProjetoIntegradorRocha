spring.application.name=Sistema Rocha Transportes

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_rocha}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT
jwt.secret=RochaSolutionsSecretKeyForJWTTokenGenerationAndValidation2024ABC
jwt.expiration=86400000
